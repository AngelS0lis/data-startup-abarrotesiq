# Orquestación completa de microservicios AbarrotesIQ (Entregables E2 y E3)
# Levanta todo en local con un solo comando: docker compose up --build
services:
  postgres_db:
    image: postgres:16-alpine
    container_name: abarrotesiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abarrotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abarrotes_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-abarrotesiq_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_abarrotesiq:/var/lib/postgresql/data
      - ./services/worker/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  ingesta:
    build:
      context: .
      dockerfile: services/ingesta/Dockerfile
    container_name: abarrotesiq-ingesta
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: abarrotesiq-worker
    restart: unless-stopped
    depends_on:
      - postgres_db
      - ingesta
    volumes:
      - ./data:/app/data

  modelos:
    build:
      context: .
      dockerfile: services/modelos/Dockerfile
    container_name: abarrotesiq-modelos
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  tablero:
    build:
      context: .
      dockerfile: services/tablero/Dockerfile
    container_name: abarrotesiq-tablero
    restart: unless-stopped
    environment:
      MODELOS_API_URL: http://modelos:8001
      INGESTA_API_URL: http://ingesta:8000
    ports:
      - "8501:8501"
    depends_on:
      - postgres_db
      - modelos
    volumes:
      - ./data:/app/data
      - ./models:/app/models

volumes:
  pgdata_abarrotesiq:

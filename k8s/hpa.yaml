# Manifiesto de Kubernetes: HorizontalPodAutoscaler (HPA) para Autoescalado (Entregable E3)
# Escala automáticamente de 1 (mínimo) a 5 (máximo) pods cuando el uso de CPU supera el 70%
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abarrotesiq-modelos-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: abarrotesiq-modelos
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abarrotesiq-ingesta-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: abarrotesiq-ingesta
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

# Manifiesto de Kubernetes: Services para exposición interna y externa (Entregable E3)
apiVersion: v1
kind: Service
metadata:
  name: abarrotesiq-ingesta-svc
  labels:
    app: abarrotesiq
    tier: ingesta
spec:
  type: NodePort
  selector:
    app: abarrotesiq
    tier: ingesta
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: abarrotesiq-modelos-svc
  labels:
    app: abarrotesiq
    tier: modelos
spec:
  type: NodePort
  selector:
    app: abarrotesiq
    tier: modelos
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: abarrotesiq-tablero-svc
  labels:
    app: abarrotesiq
    tier: tablero
spec:
  type: NodePort
  selector:
    app: abarrotesiq
    tier: tablero
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30085
